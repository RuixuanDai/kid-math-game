<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Web Natural TTS 互动体验与测试</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-start: #eff6ff;
      --bg-end: #fdf2f8;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      padding: 28px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #312e81;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .badge-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    select, textarea, input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      color: var(--text);
      background: #f8fafc;
      transition: all 0.2s ease;
      outline: none;
    }

    select:focus, textarea:focus, input[type="text"]:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.5;
    }

    .quick-templates {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .template-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #475569;
      transition: all 0.15s;
    }

    .template-btn:hover {
      background: #e2e8f0;
      color: #1e293b;
    }

    .preview-box {
      background: #fdf4ff;
      border: 1px dashed #d946ef;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      color: #86198f;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .preview-box .label {
      font-weight: 700;
      font-size: 12px;
      color: #a21caf;
    }

    .sliders-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    @media (max-width: 520px) {
      .sliders-grid {
        grid-template-columns: 1fr;
      }
    }

    .slider-item {
      background: #f8fafc;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .checkboxes-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .check-label input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .status-bar {
      margin-top: 18px;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
    }

    .status-dot.speaking {
      background: #ef4444;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><span>📢</span> Web Natural TTS 体验台</h1>
      <p>零依赖 · 纯前端 · 智能优选自然人声 · 彻底告别 Emoji 朗读杂音</p>
      <div class="badge-bar">
        <span class="badge">微软自然神经人声 (优先)</span>
        <span class="badge">Apple Siri / Ting-Ting 增强</span>
        <span class="badge">Emoji 自动净化</span>
        <span class="badge">数学口语化转化</span>
      </div>
    </header>

    <!-- 声音选择 -->
    <div class="form-group">
      <label for="voice-select">🎙️ 选择发音人 (自动优选标有 🌟)</label>
      <select id="voice-select">
        <option value="">正在检测系统内置声音...</option>
      </select>
    </div>

    <!-- 待朗读文本 -->
    <div class="form-group">
      <label for="text-input">✍️ 朗读文本 (支持输入 Emoji 和算式测试)</label>
      <textarea id="text-input">太棒啦！🎉 你连续答对了 5 道题！💪 8 + 7 = 15，给你一颗大星星 ⭐！</textarea>
      <div class="quick-templates">
        <span style="font-size: 12px; color: #64748b; line-height: 24px;">快捷示例：</span>
        <button class="template-btn" onclick="setTemplate('emoji')">🌟 Emoji 过滤测试</button>
        <button class="template-btn" onclick="setTemplate('math')">➕ 数学算式朗读</button>
        <button class="template-btn" onclick="setTemplate('kid')">🧸 儿童教育鼓励</button>
        <button class="template-btn" onclick="setTemplate('time')">⏰ 钟表时间表达</button>
      </div>
    </div>

    <!-- 过滤效果实时预览 -->
    <div class="preview-box">
      <div class="label">🔍 实际发音净化效果预览 (去除表情名字，符号口语化)：</div>
      <div id="preview-text">-</div>
    </div>

    <!-- 滑块参数 -->
    <div class="sliders-grid">
      <div class="slider-item">
        <div class="slider-header">
          <span>语速 (Rate)</span>
          <span id="rate-val" style="color: var(--primary);">0.92</span>
        </div>
        <input type="range" id="rate-slider" min="0.5" max="1.5" step="0.02" value="0.92">
        <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">推荐 0.90 ~ 0.95，儿童听力理解最舒适</div>
      </div>
      <div class="slider-item">
        <div class="slider-header">
          <span>音调 (Pitch)</span>
          <span id="pitch-val" style="color: var(--primary);">1.00</span>
        </div>
        <input type="range" id="pitch-slider" min="0.5" max="1.5" step="0.05" value="1.0">
        <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">保持 1.0 原声音调，避免刺耳电子变声</div>
      </div>
    </div>

    <!-- 开关选项 -->
    <div class="checkboxes-row">
      <label class="check-label">
        <input type="checkbox" id="check-emoji" checked>
        自动剥离 Emoji (防念出“派对礼花”)
      </label>
      <label class="check-label">
        <input type="checkbox" id="check-math" checked>
        算式口语化 (+ 转为“加”, = 转为“等于”)
      </label>
    </div>

    <!-- 播报控制按钮 -->
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-speak" onclick="handleSpeak()">
        <span>🔊</span> 立即朗读
      </button>
      <button class="btn btn-secondary" onclick="handlePauseResume()" id="btn-pause">
        <span>⏸️</span> 暂停
      </button>
      <button class="btn btn-secondary" onclick="handleStop()">
        <span>⏹️</span> 停止
      </button>
    </div>

    <!-- 底部状态栏 -->
    <div class="status-bar">
      <div>
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">准备就绪</span>
      </div>
      <div id="current-voice-info" style="font-size: 12px; color: #94a3b8;">-</div>
    </div>
  </div>

  <!-- 引入 WebNaturalTTS 库 -->
  <script src="./web-natural-tts.js"></script>
  <script>
    // 初始化 TTS 实例
    const tts = new NaturalTTS({
      lang: 'zh-CN',
      rate: 0.92,
      pitch: 1.0,
      filterEmojis: true,
      normalizeMath: true
    });

    const voiceSelect = document.getElementById('voice-select');
    const textInput = document.getElementById('text-input');
    const previewText = document.getElementById('preview-text');
    const rateSlider = document.getElementById('rate-slider');
    const pitchSlider = document.getElementById('pitch-slider');
    const rateVal = document.getElementById('rate-val');
    const pitchVal = document.getElementById('pitch-val');
    const checkEmoji = document.getElementById('check-emoji');
    const checkMath = document.getElementById('check-math');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const voiceInfo = document.getElementById('current-voice-info');
    const btnPause = document.getElementById('btn-pause');

    // 快捷模板
    const templates = {
      emoji: '太棒啦！🎉 你连续答对了 5 道题！💪 给你一颗大红心 ❤️ 和小星星 ⭐！',
      math: '算一算这道题：12 + 8 = 20，15 - 7 = 8。太厉害了！',
      kid: '不要灰心，仔细想一想，你一定能找到答案的！加油！',
      time: '现在钟表显示的是 10 点 30 分，分针指在数字 6 上面。'
    };

    function setTemplate(key) {
      if (templates[key]) {
        textInput.value = templates[key];
        updatePreview();
      }
    }

    // 更新净化预览
    function updatePreview() {
      const cleaned = tts.cleanText(textInput.value, {
        filterEmojis: checkEmoji.checked,
        normalizeMath: checkMath.checked
      });
      previewText.textContent = cleaned || '(文本为空或已被全数过滤)';
    }

    // 填充声音列表
    function populateVoices() {
      const voices = tts.getVoices();
      if (!voices || voices.length === 0) return;

      const bestVoice = tts.getBestVoice('zh-CN');
      voiceSelect.innerHTML = '';

      // 优先将中文排在前面
      const sortedVoices = [...voices].sort((a, b) => {
        const aZh = (a.lang || '').includes('zh') ? 0 : 1;
        const bZh = (b.lang || '').includes('zh') ? 0 : 1;
        return aZh - bZh;
      });

      sortedVoices.forEach(v => {
        const option = document.createElement('option');
        option.value = v.name;
        const isBest = bestVoice && v.name === bestVoice.name;
        option.textContent = `${isBest ? '🌟 [推荐] ' : ''}${v.name} (${v.lang})${v.localService ? ' [本地]' : ' [网络]'}`;
        if (isBest) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });

      if (bestVoice) {
        voiceInfo.textContent = `当前音色: ${bestVoice.name}`;
      }
    }

    // 事件绑定
    textInput.addEventListener('input', updatePreview);
    checkEmoji.addEventListener('change', updatePreview);
    checkMath.addEventListener('change', updatePreview);

    rateSlider.addEventListener('input', (e) => {
      rateVal.textContent = parseFloat(e.target.value).toFixed(2);
    });

    pitchSlider.addEventListener('input', (e) => {
      pitchVal.textContent = parseFloat(e.target.value).toFixed(2);
    });

    voiceSelect.addEventListener('change', (e) => {
      tts.setVoice(e.target.value);
      voiceInfo.textContent = `当前音色: ${e.target.value}`;
    });

    // 朗读逻辑
    async function handleSpeak() {
      const text = textInput.value;
      if (!text.trim()) return;

      statusText.textContent = '正在朗读...';
      statusDot.classList.add('speaking');
      btnPause.innerHTML = '<span>⏸️</span> 暂停';

      await tts.speak(text, {
        rate: parseFloat(rateSlider.value),
        pitch: parseFloat(pitchSlider.value),
        filterEmojis: checkEmoji.checked,
        normalizeMath: checkMath.checked,
        onEnd: () => {
          statusText.textContent = '播放完毕';
          statusDot.classList.remove('speaking');
        },
        onError: () => {
          statusText.textContent = '播放中断或出错';
          statusDot.classList.remove('speaking');
        }
      });
    }

    function handlePauseResume() {
      if (tts.isSpeaking()) {
        if (tts.isPaused()) {
          tts.resume();
          statusText.textContent = '正在朗读...';
          statusDot.classList.add('speaking');
          btnPause.innerHTML = '<span>⏸️</span> 暂停';
        } else {
          tts.pause();
          statusText.textContent = '已暂停';
          statusDot.classList.remove('speaking');
          btnPause.innerHTML = '<span>▶️</span> 继续';
        }
      }
    }

    function handleStop() {
      tts.stop();
      statusText.textContent = '已停止';
      statusDot.classList.remove('speaking');
      btnPause.innerHTML = '<span>⏸️</span> 暂停';
    }

    // 页面加载就绪
    window.addEventListener('DOMContentLoaded', () => {
      updatePreview();
      populateVoices();
      if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {
        window.speechSynthesis.onvoiceschanged = populateVoices;
      }
    });
  </script>
</body>
</html>
